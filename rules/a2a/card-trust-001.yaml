id: a2a-card-trust-001
info:
  name: A2A Agent Card Trust Consistency and Cache Policy
  author: batesian
  severity: high
  description: |
    Inspects how durable and consistent an A2A agent card's TRUST properties are,
    covering the gaps that a2a-jws-algconf-001 (signature ALGORITHM config),
    a2a-wellknown-hostinject-001 (Host reflection), and a2a-extcard-unauth-001
    (unauthenticated access) do not: consistency across well-known paths and
    cache policy for the trust anchor.

    Because Batesian scans the SERVER (not a consuming client/verifier), it judges
    only what the server itself exposes; client-side verifier acceptance is out of
    scope. Two checks:

      1. Canonicalization / multi-path consistency. The card is fetched from both
         /.well-known/agent-card.json and the legacy /.well-known/agent.json. If
         one path advertises signatures and the other does not, a high indicator
         requires matching card names and comparable preferred interfaces with
         the same URL. Comparable interfaces with different URLs
         (`supportedInterfaces[0].url` in v1, top-level `url` in v0.3) produce a
         medium routing-ambiguity indicator. Different names, card shapes,
         bindings, versions, or tenants are not compared. Missing preferred
         endpoint fields on either served card are also an indicator when names
         match.

      2. Stale-cache trust. A long max-age, applicable s-maxage, or Expires
         lifetime (>= 1h) without unqualified
         `no-store`/`no-cache` can keep the trust anchor cached after key
         rotation or compromise (INDICATOR).
         Expires uses the response Date (or receipt time when absent) and is
         ignored where max-age applies. A short s-maxage does not override
         Expires for private caches. `immutable` without explicit freshness, or
         a response with neither Cache-Control nor Expires, is a weaker
         INDICATOR because heuristic freshness may apply.
         `immutable` does not extend a short freshness lifetime. Both paths are
         checked when served; the highest-severity cache finding is reported,
         preferring the primary path on ties. Unqualified `no-store`/`no-cache`
         produce no finding; qualified `no-cache` only restricts listed header
         fields, not reuse of the card body. `max-age=0` is clean unless a long
         `s-maxage` keeps shared caches fresh. Unqualified `private` disables
         shared caching.
         `must-revalidate` applies only after a response becomes stale, so it
         does not shorten a long freshness lifetime.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://a2a-protocol.org/v0.3.0/specification/
    - https://www.rfc-editor.org/rfc/rfc8246.html
    - https://www.rfc-editor.org/rfc/rfc9111.html
    - https://cwe.mitre.org/data/definitions/345.html
    - https://cwe.mitre.org/data/definitions/347.html

  tags:
    - a2a
    - agent-card
    - canonicalization
    - cache
    - cwe-345
    - cwe-347

attack:
  protocol: a2a
  type: a2a-card-trust

remediation: |
  1. Serve byte-identical, consistently-signed agent cards at every well-known
     path; never expose an unsigned variant alongside a signed one.
  2. Set Cache-Control on the agent card to require revalidation
     (e.g. `no-cache` or a short `max-age` with `must-revalidate`) so clients
     re-fetch after key rotation or card changes; avoid long TTLs in both
     Cache-Control and Expires, and do not rely on `immutable` to define the
     freshness lifetime.
  3. Require clients to verify signatures before trusting any
     routing, capability, or security-scheme field from a card.
