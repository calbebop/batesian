id: a2a-push-ssrf-001
info:
  name: A2A Private Push Callback Delivery
  author: batesian
  severity: medium
  description: |
    Registers the scanner's push callback URL and checks for delivery. A medium
    indicator requires an observed callback to a local or private address. This
    proves delivery to the scanner's listener, not access to other internal
    services or a violation of the deployment's callback policy.

  references:
    - https://a2a-protocol.org/latest/specification/#132-push-notification-security
    - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    - https://cwe.mitre.org/data/definitions/918.html

  tags:
    - a2a
    - ssrf
    - push-notification
    - oob
    - owasp-agentic-top10
    - cwe-918

attack:
  protocol: a2a
  type: push-notification-ssrf

remediation: |
  Review which callback destinations are permitted. If private callbacks are
  not intended, validate resolved destinations before registration and delivery,
  including redirects and DNS changes. Prefer HTTPS for production webhooks.
