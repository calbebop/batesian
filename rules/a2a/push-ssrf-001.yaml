id: a2a-push-ssrf-001
info:
  name: A2A Push Notification SSRF
  author: batesian
  severity: high
  description: |
    Registers the scanner's push callback URL and checks for delivery. A finding
    requires an observed callback to a local or private address. A callback to
    a public webhook is normal A2A behavior, not SSRF evidence. This probe does
    not test reachability to other internal services.

  references:
    - https://a2a-protocol.org/latest/specification/#132-push-notification-security
    - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
    - https://cwe.mitre.org/data/definitions/918.html

  tags:
    - a2a
    - ssrf
    - push-notification
    - oob
    - owasp-agentic-top10
    - cwe-918

attack:
  protocol: a2a
  type: push-notification-ssrf

remediation: |
  Validate callback URLs before registration and again before delivery. Reject
  private, loopback, link-local, and metadata service destinations after DNS
  resolution; prevent redirect or DNS rebinding bypasses. Require HTTPS for
  production webhooks and use an allowlist where appropriate.
