id: a2a-task-cancel-idor-001
info:
  name: A2A Cross-Principal Task Cancellation
  author: batesian
  severity: high
  description: |
    Creates a throwaway task as one principal and confirms its live state.
    Probes CancelTask and tasks/cancel anonymously, then as a second principal
    only if anonymous cancellation is conclusively denied.
    Reports unauthenticated or cross-principal cancellation only when an owner
    read-back confirms that the same task became canceled. A rejection on one
    method does not mask a vulnerable second method.

    Ambiguous responses or an already-terminal task are inconclusive. If both
    methods are unavailable, the rule does not apply. The rule never cancels a
    pre-existing task.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/862.html

  tags:
    - a2a
    - authorization
    - idor
    - tasks
    - cancel
    - cwe-639

attack:
  protocol: a2a
  type: a2a-task-cancel-idor

remediation: |
  1. Authenticate every cancel request and bind cancellation to the task's owning
     principal; reject a cancel from any other identity with an authorization
     error.
  2. Never allow unauthenticated cancellation of a task.
  3. Apply the same owner-scoping to all task-lifecycle operations (get, cancel,
     resubscribe, push-config), not just task creation.
