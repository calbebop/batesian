id: a2a-task-cancel-idor-001
info:
  name: A2A Cross-Principal Task Cancellation
  author: batesian
  severity: high
  description: |
    Creates a throwaway task as one principal and confirms its live state.
    Probes CancelTask and tasks/cancel anonymously, then as a second principal
    only if anonymous cancellation is conclusively denied.
    Reports observed anonymous or cross-principal cancellation only when a matching
    successful cancel reply and an owner read-back both show the task canceled.
    These are indicators until the agent's authorization policy establishes that
    the caller should have been denied.
    A rejection on one method does not mask a successful second method.

    A denied cancel followed by a separate cancellation is inconclusive.
    Ambiguous responses or an already-terminal task are inconclusive. If both
    methods are unavailable, the rule does not apply. The rule never cancels a
    pre-existing task.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/862.html

  tags:
    - a2a
    - authorization
    - idor
    - tasks
    - cancel
    - cwe-639

attack:
  protocol: a2a
  type: a2a-task-cancel-idor

remediation: |
  Review who may cancel each task. If cancellation should be private, authenticate
  the caller and enforce that policy on every cancel binding. Apply consistent
  authorization to other task-lifecycle operations.
