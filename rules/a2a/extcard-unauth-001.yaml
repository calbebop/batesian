id: a2a-extcard-unauth-001
info:
  name: Extended Agent Card Unauthenticated Disclosure
  author: batesian
  severity: critical
  description: |
    Tests whether the A2A Extended Agent Card endpoint is accessible without
    authentication. The extended card may contain skills and interfaces intended
    only for authenticated callers. Anonymous access can disclose those details.
    Acceptance of a fabricated token is an authentication bypass only when an
    anonymous request to the same operation is refused.

    An issue in the A2A samples repository reports that its helloworld example
    returns an extended card with or without a token.

  references:
    - https://github.com/a2aproject/a2a-samples/issues/340
    - https://github.com/a2aproject/A2A/blob/main/docs/specification.md
    - https://cwe.mitre.org/data/definitions/862.html
    - https://cwe.mitre.org/data/definitions/200.html

  tags:
    - a2a
    - authentication
    - information-disclosure
    - extended-agent-card
    - owasp-agentic-top10
    - cwe-862
    - cwe-200

attack:
  protocol: a2a
  type: extcard-unauth-disclosure

remediation: |
  Gate the /extendedAgentCard endpoint behind the same authentication mechanism
  as other privileged endpoints (OAuth 2.1 Bearer token, JWS assertion, or API key).
  Return HTTP 401 with a WWW-Authenticate header for unauthenticated requests.
  The public /.well-known/agent-card.json may advertise that an extended card exists
  (capabilities.extendedAgentCard: true) without disclosing its contents.
