id: a2a-push-callback-auth-001
info:
  name: A2A Push Notification Missing Configured Webhook Authentication
  author: batesian
  severity: high
  description: |
    Registers a push callback with Bearer credentials in the authentication
    field. A task-correlated notification without the configured Authorization
    header is reported at high severity. Echoing the optional token field does
    not satisfy webhook authentication.

    Webhook checks and unrelated task callbacks are ignored. No observed task
    notification is reported as not tested. External OOB collectors require
    manual verification.

  references:
    - https://a2a-protocol.org/v1.0.1/specification/
    - https://a2a-protocol.org/v0.3.0/specification/
    - https://cwe.mitre.org/data/definitions/345.html

  tags:
    - a2a
    - push-notifications
    - webhooks
    - authenticity
    - cwe-345

attack:
  protocol: a2a
  type: a2a-push-callback-auth

remediation: |
  Send the configured authentication credentials on every push notification.
  For Bearer authentication, use the Authorization header with the exact
  configured credential. Receivers should reject callbacks without it and
  verify the task ID before processing the notification.
