id: a2a-peer-impersonation-001
info:
  name: A2A Forged JWT Acceptance
  author: batesian
  severity: high
  description: |
    Sends a randomly signed JWT and compares SendMessage with an anonymous
    baseline. Acceptance of the JWT while anonymous access is denied confirms
    that this token passed the endpoint's authentication gate. It does not prove
    that the claimed peer identity or any elevated privilege was granted.

    If both requests succeed, the rule reports anonymous access as an indicator.
    Public access may be intentional, so review the deployment policy.

  references:
    - https://a2aprotocol.ai/docs/specification#authentication
    - https://owasp.org/www-project-top-ten/2021/A07_2021-Identification_and_Authentication_Failures
    - https://datatracker.ietf.org/doc/html/rfc7519
    - https://cwe.mitre.org/data/definitions/290.html
    - https://cwe.mitre.org/data/definitions/347.html

  tags:
    - a2a
    - authentication
    - jwt
    - impersonation
    - broken-auth
    - owasp-agentic-top10
    - cwe-290
    - cwe-347

attack:
  protocol: a2a
  type: a2a-peer-impersonation

remediation: |
  If SendMessage requires authentication, verify token signatures, issuer,
  audience, and subject before granting access. Document intentional public
  access separately from peer-authenticated operations.
