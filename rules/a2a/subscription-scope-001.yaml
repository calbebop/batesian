id: a2a-subscription-scope-001
info:
  name: A2A Subscription and Task-Read Scope Mismatch
  author: batesian
  severity: high
  description: |
    Creates a nonterminal task as one principal and confirms that a second
    principal cannot read it. Checks whether that principal can nevertheless
    receive matching task and context data from a subscription stream. Reads
    only the first response event and closes the stream.

    Different operations may intentionally have different grants. A finding is
    an indicator to review against the agent's access policy, not proof that
    the subscription was unauthorized.

    Supports v1.0 and v0.3 JSON-RPC and advertised HTTP+JSON. gRPC is not tested.

  references:
    - https://a2a-protocol.org/v1.0.1/specification/#316-subscribe-to-task
    - https://a2a-protocol.org/v1.0.1/specification/#131-data-access-and-authorization-scoping
    - https://cwe.mitre.org/data/definitions/639.html

  tags:
    - a2a
    - streaming
    - authorization
    - task-binding
    - cwe-639

attack:
  protocol: a2a
  type: a2a-subscription-scope

remediation: |
  Confirm whether the second principal should have subscription access. If
  not, authorize each SubscribeToTask or tasks/resubscribe request against the
  task's access policy before starting the stream, on every advertised binding.
