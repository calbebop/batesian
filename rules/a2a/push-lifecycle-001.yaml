id: a2a-push-lifecycle-001
info:
  name: A2A Push Config List/Delete Outside Task Scope
  author: batesian
  severity: high
  description: |
    Creates separate tasks and push configs as two principals. For each task,
    confirms the other principal cannot read it, then checks whether that
    principal can list or delete the owner's config. Delete is attempted only
    against scanner-created configs, with owner readback and cleanup.

    A finding is an indicator because push-config grants may differ from task
    read grants. Review the result against the agent's authorization policy.

    Supports v1.0 and v0.3 JSON-RPC and advertised HTTP+JSON bindings. It does
    not test callback delivery or gRPC.

  references:
    - https://a2a-protocol.org/v1.0.1/specification/#131-data-access-and-authorization-scoping
    - https://a2a-protocol.org/v1.0.1/specification/#319-list-push-notification-configs
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/862.html

  tags:
    - a2a
    - push-notification
    - authorization
    - task-binding
    - cwe-639

attack:
  protocol: a2a
  type: a2a-push-lifecycle

remediation: |
  Confirm whether a caller denied task reads should list or delete that task's
  push configs. If not, enforce the intended policy on both operations.
