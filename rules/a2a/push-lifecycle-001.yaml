id: a2a-push-lifecycle-001
info:
  name: A2A Push Config List/Delete Outside Task Scope
  author: batesian
  severity: high
  description: |
    Creates a task and push config as one principal, then confirms that a
    second principal cannot read the task. Checks whether that principal can
    list the owner's config or delete it. Delete is attempted only against
    the scanner-created config, with owner readback and cleanup.

    Supports the v1.0 and v0.3 JSON-RPC bindings. It does not test callback
    delivery or HTTP+JSON and gRPC bindings.

  references:
    - https://a2a-protocol.org/latest/specification/#131-data-access-and-authorization-scoping
    - https://a2a-protocol.org/latest/specification/#319-list-push-notification-configs
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/862.html

  tags:
    - a2a
    - push-notification
    - authorization
    - task-binding
    - cwe-639

attack:
  protocol: a2a
  type: a2a-push-lifecycle

remediation: |
  Apply the task's authorization policy to every push-config operation,
  including list and delete. Scope list results to the caller's accessible
  task and require the same task access before deleting a config.
