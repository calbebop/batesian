id: a2a-artifact-tamper-001
info:
  name: A2A Completed Task Artifact Replacement
  author: batesian
  severity: critical
  description: |
    Tests whether a continuation replaces an existing artifact on a completed task.
    The rule reads the artifact before and after the continuation and compares
    content under the same artifact ID. Task history alone is insufficient because
    a server may return only recent messages.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://owasp.org/www-project-top-10-for-large-language-model-applications/
    - https://cwe.mitre.org/data/definitions/284.html
    - https://cwe.mitre.org/data/definitions/639.html

  tags:
    - a2a
    - task
    - artifact
    - tampering
    - integrity
    - cwe-284
    - cwe-639

attack:
  protocol: a2a
  type: a2a-artifact-tamper

remediation: |
  1. Reject continuations of completed tasks.
  2. Preserve existing artifact content and identifiers across task updates.
  3. If artifact changes are intentional, version them and authorize writers.
