id: a2a-task-idor-001
info:
  name: A2A Task Read or List Authorization Bypass
  author: batesian
  severity: high
  description: |
    Detects broken object-level authorization (IDOR / BOLA) on A2A task reads
    and listings. A confirmed read finding requires the authenticated owner's
    unique probe text in an anonymous task response. An echoed task ID or generic
    status alone does not prove content disclosure.

    To avoid mislabelling a server that simply has no authentication, the check
    uses an auth-enforcement discriminator. It (1) creates a task as the
    authenticated owner, (2) confirms the same creation method rejects anonymous
    callers, then (3) reads the task without credentials. The rule also probes
    GET /v1/tasks and /tasks. A list finding requires the authenticated
    owner's task ID in the anonymous response; unrelated or anonymous-owned tasks
    do not establish disclosure.

    Precondition: supply --token so the executor has an authenticated owner
    identity to test against. Without a token, a properly auth-gated server
    rejects the creation step. The anonymous list probe may still run, but a
    populated list without a known owner task is inconclusive.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://owasp.org/www-project-top-ten/2021/A01_2021-Broken_Access_Control
    - https://cwe.mitre.org/data/definitions/639.html

  tags:
    - a2a
    - idor
    - authorization
    - task
    - owasp-agentic-top10
    - cwe-639

attack:
  protocol: a2a
  type: a2a-task-idor

remediation: |
  Bind every task and contextId to the authenticated session identity at creation
  time. Verify ownership on every tasks/get, tasks/cancel, and tasks/list request.
  Return JSON-RPC error -32001 (TaskNotFoundError) for any task that does not
  belong to the requesting caller - do not reveal whether the task exists.
