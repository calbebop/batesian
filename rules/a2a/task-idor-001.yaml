id: a2a-task-idor-001
info:
  name: A2A Task Read or List Exposure
  author: batesian
  severity: medium
  description: |
    Reports anonymous access to an A2A task or task list. A read indicator requires
    the authenticated owner's unique probe text in an anonymous task response.
    An echoed task ID or generic status alone does not prove content visibility.
    Whether access is unauthorized depends on the agent's sharing and
    authorization policy.

    To avoid mislabelling a server that simply has no authentication, the check
    uses an auth-enforcement discriminator. It (1) creates a task as the
    authenticated owner, (2) confirms the same creation method rejects anonymous
    callers, then (3) reads the task without credentials. The rule also probes
    JSON-RPC ListTasks and REST GET /v1/tasks and /tasks. A list finding requires
    the authenticated owner's task ID in the anonymous response; unrelated or
    anonymous-owned tasks do not establish disclosure. Only one list finding is
    emitted if both JSON-RPC and REST expose the same task.

    Precondition: supply --token so the executor has an authenticated owner
    identity to test against. Without a token, a properly auth-gated server
    rejects the creation step. The anonymous list probe may still run, but a
    populated list without a known owner task is inconclusive.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://owasp.org/www-project-top-ten/2021/A01_2021-Broken_Access_Control
    - https://cwe.mitre.org/data/definitions/639.html

  tags:
    - a2a
    - idor
    - authorization
    - task
    - owasp-agentic-top10
    - cwe-639

attack:
  protocol: a2a
  type: a2a-task-idor

remediation: |
  Review whether these tasks should be public or shared. For private tasks,
  scope GetTask and ListTasks to authorized callers and return TaskNotFoundError
  for callers without access.
