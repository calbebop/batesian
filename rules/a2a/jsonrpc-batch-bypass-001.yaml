id: a2a-jsonrpc-batch-bypass-001
info:
  name: A2A JSON-RPC Batch Authentication Bypass
  author: batesian
  severity: medium
  description: |
    Compares an unauthenticated GetTask request with the same request wrapped in
    a one-element JSON-RPC batch. The control must return HTTP 401/403 or a
    correlated JSON-RPC authentication error. The batch reply must match the
    request ID and contain exactly one response.

    A returned task object confirms access despite the control's auth refusal
    (CWE-288). TaskNotFound is a risk indicator only: A2A also uses it when a
    task is inaccessible. Rejected batches produce no finding.

    The probe reads a random, non-existent task ID and does not mutate state.
    JSON-RPC 2.0 permits batches. If a server accepts them, it must apply the
    same authentication and authorization checks as for single requests.

  references:
    - https://www.jsonrpc.org/specification#batch
    - https://a2a-protocol.org/latest/specification/
    - https://cwe.mitre.org/data/definitions/288.html

  tags:
    - a2a
    - auth
    - json-rpc
    - batch
    - bypass
    - cwe-288

attack:
  protocol: a2a
  type: a2a-jsonrpc-batch-bypass

remediation: |
  Apply the same authentication and authorization checks to single requests and
  each element of an accepted batch. Reject batch arrays before dispatch if the
  server does not support them.
