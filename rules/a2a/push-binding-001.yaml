id: a2a-push-binding-001
info:
  name: A2A Push Config Not Bound to Task Owner
  author: batesian
  severity: high
  description: |
    Checks whether an anonymous caller or a second principal can attach a push
    callback to another principal's task. It also checks whether the second
    principal can read the owner's callback URL. Each write must persist in an
    owner readback before it is reported. One authenticated principal is enough
    for the anonymous-write check. If that write does not persist, two distinct
    principals are needed for cross-principal checks. Tests JSON-RPC and
    advertised HTTP+JSON bindings.

    This rule does not verify callback delivery or token disclosure. A finding
    is an indicator because push-config grants may differ from task-read grants.
    An exact expected_denials policy can confirm the observed access.

  references:
    - https://a2a-protocol.org/v1.0.1/specification/#131-data-access-and-authorization-scoping
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/862.html
    - https://cwe.mitre.org/data/definitions/441.html

  tags:
    - a2a
    - push-notification
    - webhook
    - task-binding
    - authorization
    - cwe-639

attack:
  protocol: a2a
  type: a2a-push-binding

remediation: |
  Confirm whether these callers should create or read the task's push configs.
  If not, enforce the intended authorization policy on every operation. Keep
  callback URLs and tokens within their permitted audience. Validate callback
  destinations before registration and delivery (see a2a-push-ssrf-001).
