id: a2a-push-binding-001
info:
  name: A2A Push Config Not Bound to Task Owner
  author: batesian
  severity: high
  description: |
    Checks whether an anonymous caller or a second principal can attach a push
    callback to another principal's task. It also checks whether the second
    principal can read the owner's callback URL. Each write must persist in an
    owner readback before it is reported. One authenticated principal is enough
    for the anonymous-write check. If that write does not persist, two distinct
    principals are needed for cross-principal checks.

    This rule does not verify callback delivery or token disclosure.

  references:
    - https://a2a-protocol.org/latest/specification/#131-data-access-and-authorization-scoping
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/862.html
    - https://cwe.mitre.org/data/definitions/441.html

  tags:
    - a2a
    - push-notification
    - webhook
    - task-binding
    - authorization
    - cwe-639

attack:
  protocol: a2a
  type: a2a-push-binding

remediation: |
  Require authentication and task-level authorization for every push-config
  operation, including create, get, list, and delete. Keep callback URLs and
  tokens private to the task owner. Validate callback destinations before
  registration and delivery (see a2a-push-ssrf-001).
