id: a2a-task-enumeration-001
info:
  name: A2A Cross-Credential Task Listing
  author: batesian
  severity: medium
  description: |
    Principal A creates a task and confirms it appears in A's ListTasks response.
    An anonymous listing must not return it. If principal B's listing contains the
    task, the rule reports an indicator for review against the agent's access policy.
    Different credentials do not, by themselves, prove different task visibility.
    The check does not read task history or assume that B can read or modify the task.

    ListTasks is defined in A2A v1.0. The rule also checks advertised HTTP+JSON
    list bindings. Missing, refused, or incomplete listings are not reported as
    authorization failures.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/200.html
    - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/

  tags:
    - a2a
    - authorization
    - multi-tenant
    - enumeration
    - cwe-639
    - cwe-200

attack:
  protocol: a2a
  type: a2a-task-enumeration

remediation: |
  Confirm whether the two credentials are meant to share task visibility. If not,
  filter ListTasks results, counts, and pagination by the caller's authorized scope.
