id: a2a-context-fixation-001
info:
  name: A2A Context ID Fixation (Client-Supplied contextId Across Principals)
  author: batesian
  severity: high
  description: |
    Tests whether an A2A server lets a CLIENT pre-seed the conversation
    `contextId` and then merges a DIFFERENT principal's messages into that same
    context - the A2A half of the session/task-ID fixation concern (the MCP half
    is mcp-session-fixation-001). The server should mint contextIds itself and
    scope each context to its participants; a server that adopts a client-chosen
    contextId and exposes another principal's messages under it lets an attacker
    fix a context, lure a victim onto it, and read the victim's content
    (CWE-384).

    This is a stateful, multi-principal chained check requiring at least two
    principals with valid, distinct credentials (an attacker A and a victim B);
    configure them via a `principals:` block or repeated --principal flags.

    Sequence:
      1. As A, send a message carrying a client-chosen `contextId`. If the server
         returns its OWN contextId instead, it mints server-side - secure - and
         no finding is raised.
      2. Confirm the server is not simply open: an UNAUTHENTICATED message under
         the fixed contextId must be rejected. If it succeeds, the server has no
         auth at all (not fixation) - no finding.
      3. As victim B, send a message containing a secret marker under the SAME
         fixed contextId.
      4. As A, read the context back. A finding is confirmed only when A can see
         B's secret marker - proving the attacker-fixed contextId merged the two
         principals' conversations.

    Impact: an attacker who pre-seeds a contextId can capture another principal's
    messages, tool outputs, and embedded context once the victim is steered onto
    the fixed context.

  references:
    - https://a2a-protocol.org/latest/specification/
    - https://owasp.org/www-community/attacks/Session_fixation
    - https://cwe.mitre.org/data/definitions/384.html

  tags:
    - a2a
    - session-fixation
    - context
    - handoff
    - chained
    - cwe-384

attack:
  protocol: a2a
  type: a2a-context-fixation

remediation: |
  1. Always generate the contextId server-side; never adopt a client-supplied
     contextId as authoritative for grouping a conversation.
  2. Scope each context to the principals that legitimately participate in it and
     reject (or partition) messages from other principals; never merge two
     principals' messages into one context because they share an id.
  3. Rotate context/session identifiers on identity transitions and handoffs so a
     pre-seeded id cannot bridge a trust boundary.
  4. Record the acting principal per message so cross-principal context joins are
     auditable.
