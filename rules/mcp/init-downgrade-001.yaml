id: mcp-init-downgrade-001
info:
  name: MCP Protocol Version Downgrade Auth Bypass
  author: batesian
  severity: high
  description: |
    Tests whether advertising a protocol version that predates the mandatory
    OAuth 2.1 authorization framework (specifically "2024-11-05", published
    before the MCP authorization specification) lets a caller bypass authorization
    that the server enforces under the modern version ("2025-03-26").

    Accepting or negotiating an older protocol version is, by itself, SPEC-
    COMPLIANT and is NOT reported as a finding. The vulnerability is specifically
    a downgrade AUTH BYPASS, and the rule confirms it with a discriminator: it
    calls resources/list under BOTH a modern-version session and a legacy-version
    session and compares the outcomes.

    - modern rejected (auth enforced) + legacy granted  => confirmed downgrade
      bypass (critical / ConfirmedExploit).
    - both granted  => the server simply has no auth at all; that is reported by
      mcp-resources-unauth, not here (no finding).
    - both rejected, or the legacy version rejected at initialize  => secure
      (no finding).

    A well-implemented server should either:
    a) Reject unsupported protocol versions, or
    b) Apply identical security controls regardless of the negotiated version.

  references:
    - https://modelcontextprotocol.io/docs/concepts/authorization
    - https://spec.modelcontextprotocol.io/specification/2025-03-26/
    - https://spec.modelcontextprotocol.io/specification/2024-11-05/
    - https://cwe.mitre.org/data/definitions/757.html

  tags:
    - mcp
    - auth-bypass
    - version-downgrade
    - protocol
    - cwe-757

attack:
  protocol: mcp
  type: mcp-init-downgrade

remediation: |
  1. Maintain a server-side allowlist of supported protocol versions; reject
     initialize requests with unknown or unsupported versions with a JSON-RPC
     error (code -32600, "Invalid Request").
  2. Apply identical authentication and authorization checks regardless of the
     negotiated protocol version. Do not branch security logic on protocol version.
  3. If older versions must be supported for compatibility, document which versions
     are accepted and ensure security controls are backported to all of them.
