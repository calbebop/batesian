id: mcp-header-body-split-001
info:
  name: MCP Modern Header/Body Mismatch
  author: batesian
  severity: medium
  description: |
    On an advertised MCP 2026-07-28 wire, compares matching and mismatched
    MCP-Protocol-Version and Mcp-Method headers on read-only tools/list requests.
    It also compares Mcp-Name with the body on advertised resource and prompt
    reads using a nonexistent subject. It never invokes tools.

    A matching request must reach the method before a mismatch is judged.
    The expected mismatch response is HTTP 400 with JSON-RPC -32020. An
    accepted mismatch is a protocol indicator, not proof of gateway bypass.
    Other errors leave that check untested. Legacy handshake wires have no
    2026 header-validation requirement and are not graded by this rule.
  references:
    - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http
    - https://modelcontextprotocol.io/seps/2243-http-standardization
    - https://cwe.mitre.org/data/definitions/436.html
  tags:
    - mcp
    - streamable-http
    - header-validation
    - cwe-436

attack:
  protocol: mcp
  type: mcp-header-body-split

remediation: |
  Validate MCP-Protocol-Version, Mcp-Method, and Mcp-Name against the request
  body before dispatch on MCP 2026-07-28. Reject missing or mismatched headers
  with HTTP 400 and JSON-RPC -32020. Gateways that use these headers for policy
  should require the modern version and validate the same values.
