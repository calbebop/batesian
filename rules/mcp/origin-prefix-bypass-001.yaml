id: mcp-origin-prefix-bypass-001
info:
  name: MCP Origin Validation Bypassed by Prefix-Forged Origin
  author: batesian
  severity: high
  description: |
    Tests whether an MCP server rejects an unrelated Origin but accepts a
    browser-serializable Origin whose foreign hostname extends the target's
    hostname. This exposes host-prefix checks such as
    strings.HasPrefix(origin, "https://trusted.example") without mistaking
    malformed headers for a browser-mediated bypass.

    The canary uses a non-resolving .invalid hostname and retains the target's
    scheme and non-default port. Userinfo is never sent: browsers omit it from
    Origin. Acceptance confirms a validation gap; exploitability also depends
    on network and TLS conditions. If the unrelated control is accepted too,
    mcp-dns-rebind-origin-001 covers the unvalidated surface instead.

  references:
    - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http
    - https://fetch.spec.whatwg.org/#origin-header
    - https://cwe.mitre.org/data/definitions/346.html

  tags:
    - mcp
    - origin-validation
    - dns-rebinding
    - request-forgery
    - cwe-346

attack:
  protocol: mcp
  type: mcp-origin-prefix-bypass

remediation: |
  1. Parse Origin and compare scheme, hostname, and port against an exact
     allowlist; reject malformed values and userinfo with HTTP 403.
  2. Test with a valid foreign hostname that extends a trusted hostname, not
     only an unrelated Origin or a malformed userinfo value.
  3. Apply the check consistently across every served transport.
