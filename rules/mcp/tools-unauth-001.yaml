id: mcp-tools-unauth-001
info:
  name: MCP Tools Listed Without Authentication
  author: batesian
  severity: info
  description: |
    Tests whether tools/list exposes tool definitions without authentication.

    A non-empty tools/list response exposes tool names and metadata to an
    unauthenticated caller. MCP authorization is optional, so a public catalog
    is informational unless the deployment expects it to be protected. The
    rule never invokes a tool and cannot establish invocation access.

  references:
    - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
    - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization

  tags:
    - mcp
    - auth
    - tools
    - access-control

attack:
  protocol: mcp
  type: mcp-tools-unauth

remediation: |
  If the catalog is intended to be private, require authentication before
  returning tools/list. For protected HTTP operations, reject missing or invalid
  bearer tokens with HTTP 401 and insufficient scope with HTTP 403. Enforce
  authorization separately for tools/call; listing a tool does not grant access
  to invoke it.
