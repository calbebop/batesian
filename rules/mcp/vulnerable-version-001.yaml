    Every finding is an INDICATOR. The version is self-reported and trivially
    spoofed, and matching a range does not prove the vulnerable code path is
    reachable from this surface. Each finding names its advisories so the
    operator verifies against the actual patch. A supplied bearer token is used
    for read-only inventory when the endpoint is protected.

    Earlier filesystem releases report a static 0.2.0 server version, and
    earlier mcp-fetch and mcp-server-git releases may report the MCP SDK
    version. Those values cannot identify the installed package release. The
    inventory entries start where the reference servers report package versions.

    Client helpers and inspector control planes are outside serverInfo version
    matching. The mcp-atlassian handshake does not reliably report its package
    release. Verify these components through installed-package inventory.

    A name that matches a table entry but reports an unparseable version yields
    one low indicator listing the related advisories. Neither clean nor
    vulnerable can be claimed from what the server publishes. Other identities
    yield no finding under this rule. That does not establish that their
    installed components are unaffected.

