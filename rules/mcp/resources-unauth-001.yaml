id: mcp-resources-unauth-001
info:
  name: MCP Resources Unauthenticated Read
  author: batesian
  severity: high
  description: |
    Attempts to list and read MCP resources without authentication. The MCP
    protocol exposes resources/list and resources/read endpoints alongside
    tools/list. These resources can contain file system contents, database
    records, environment variables, API keys, or other sensitive data.

    MCP authorization is optional, so an anonymous list or benign resource
    read is informational. A read containing a potential credential is a high
    severity indicator. Pattern matching does not prove the credential is live.

  references:
    - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
    - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
    - https://cwe.mitre.org/data/definitions/200.html

  tags:
    - mcp
    - resources
    - authorization
    - disclosure
    - unauthenticated
    - cwe-200

attack:
  protocol: mcp
  type: mcp-resources-unauth

remediation: |
  Review whether each listed resource is intended to be public. Remove
  credentials from resource content. For protected resources, enforce access
  before resources/list and resources/read: use HTTP 401 for missing or invalid
  bearer tokens and HTTP 403 for insufficient scope. Limit each authenticated
  client to the resources it is authorized to read.
