id: mcp-oauth-metadata-ssrf-001
info:
  name: MCP OAuth DCR Metadata Fetch
  author: batesian
  severity: high
  description: |
    Checks whether an MCP OAuth authorization server fetches registrant-supplied
    URL metadata during dynamic client registration (DCR). The rule sends
    field-specific URLs to a controlled callback listener. A callback proves a
    server-side fetch, even if registration is rejected. A public callback is
    informational: fetching public metadata can be legitimate under RFC 7591.
    A callback to a private listener address confirms a request to that private
    address, but does not prove access to other hosts or response contents.

    The check:

      1. Discover the registration endpoint via
         /.well-known/oauth-authorization-server (then openid-configuration).
      2. Send an UNAUTHENTICATED DCR registration whose URL metadata fields all
         point at the Batesian OOB listener, each carrying a unique marker path.
      3. If the OOB listener receives a matching request, report the field fetched.

    With an external OOB server (--oob-url), accepted registration is reported
    as an indicator for manual callback review.

  references:
    - https://www.rfc-editor.org/rfc/rfc7591
    - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
    - https://cwe.mitre.org/data/definitions/918.html

  tags:
    - mcp
    - oauth
    - dcr
    - ssrf
    - metadata
    - cwe-918

attack:
  protocol: mcp
  type: mcp-oauth-metadata-ssrf

remediation: |
  Review whether DCR metadata fetches are needed. If they are, restrict schemes
  and destination hosts, reject loopback and private addresses, revalidate after
  redirects and DNS changes, and bound response size and time. Treat fetched
  metadata as untrusted input.
