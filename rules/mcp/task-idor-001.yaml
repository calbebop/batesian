id: mcp-task-idor-001
info:
  name: MCP Task Readable Across Authorization Contexts
  author: batesian
  severity: critical
  description: |
    Tests whether MCP tasks are bound to the authorization context that created
    them.

    MCP 2025-11-25 introduced durable tasks. A task-augmented tools/call returns
    a taskId immediately, and the caller later reads execution state with
    tasks/get and the underlying tool output with tasks/result. The
    specification's Security Considerations are explicit:

      "receivers MUST reject tasks/get, tasks/result, and tasks/cancel requests
       for tasks that do not belong to the same authorization context as the
       requestor."

    The rule needs TWO DISTINCT CREDENTIALS, because the requirement binds tasks
    to an authorization context and crossing that needs two of them. Pass two
    --principal flags (or a config with two principals); with fewer, or with two
    principals presenting the same credential, it reports not tested rather than
    clean. Two identities differing only by a gateway-resolved header are two
    contexts, and those headers are sent. Session ids are NOT authorization
    contexts: a server that binds tasks to the credential but not additionally to
    the session is conformant, so the rule does not compare session ids.

    The rule creates a task as one principal and attempts to read it from a
    separate session as another, reporting three distinct failures:

    - tasks/get returns another context's task (high). Task metadata discloses
      execution status, timing, and status messages for work the caller did not
      initiate.
    - tasks/result returns another context's result (critical). This is the
      actual output of the tool invocation, not metadata, so whatever that tool
      produced crosses the authorization boundary.
    - tasks/list exposes another context's task (critical). The rule follows up
      to four pages and leaves an unfinished list walk not tested.

    By-ID findings require a successful owner read, refusal of a never-issued
    task ID, and a tasks/get response naming the requested task. A tasks/result
    finding also requires matching related-task metadata, a refused unknown-ID
    control, and output matching the owner's result. Task handles, status
    messages, and tool output are redacted from findings.

    A finding requires an anonymous initialize or task creation refusal, or an
    anonymous task read refusal after open creation. A fully open task surface
    is suppressed rather than reported as broken object-level authorization.

    Safety: creating a task invokes a real tool. Approve its exact name with
    --mcp-invoke-tool or mcp_invoke_tools after reviewing it. The rule also
    requires consistent readOnlyHint true and task support, but annotations are
    untrusted hints. Missing approval is NOT TESTED, not clean. Tool discovery
    follows up to ten tools/list pages; an unfinished walk is also NOT TESTED.
    Because tasks/result blocks until a task is terminal, the rule polls tasks/get within
    a bounded budget and only requests the result once the task has finished.
    Stateful sessions are closed with best-effort DELETE after the check.

    Currency: tasks were introduced as experimental in 2025-11-25, and the
    2026-07-28 revision moved them out of the core protocol into the
    io.modelcontextprotocol/tasks extension. The redesign replaces the blocking
    tasks/result method with polling via tasks/get, adds tasks/update, and removes
    tasks/list. This rule targets the 2025-11-25 core shape: it gates on the core
    tasks capability, so a 2026-07-28 server that advertises the extension instead
    is skipped rather than mis-tested. Covering the extension is separate work.

  references:
    - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
    - https://modelcontextprotocol.io/specification/2025-11-25/basic/utilities/tasks
    - https://cwe.mitre.org/data/definitions/639.html
    - https://cwe.mitre.org/data/definitions/200.html

  tags:
    - mcp
    - auth
    - tasks
    - idor
    - cwe-639
    - cwe-200

attack:
  protocol: mcp
  type: mcp-task-idor

remediation: |
  1. Bind every task to the authorization context that created it, and reject
     tasks/get, tasks/result, and tasks/cancel for tasks belonging to any other
     context. Return a JSON-RPC -32602 rather than the task.
  2. Scope tasks/list to the requestor's own tasks. If the deployment cannot
     identify requestors, do not advertise the tasks.list capability at all.
  3. Where context binding is genuinely unavailable, generate task IDs with
     enough entropy that they cannot be guessed, keep TTLs short, and document
     the limitation so operators know task results are reachable by ID alone.
  4. Rate-limit task operations so task IDs cannot be enumerated.
