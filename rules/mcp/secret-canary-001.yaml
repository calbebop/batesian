id: mcp-secret-canary-001
info:
  name: MCP Credential Canary Reflected in Responses
  author: batesian
  severity: medium
  description: |
    Presents a unique, high-entropy CANARY bearer token to an MCP server across a
    handful of standard calls (initialize, tools/list, resources/list, and a
    malformed call to elicit a verbose error), then checks whether the canary
    value appears verbatim in ANY response body. If it does, the server copies the
    caller's bearer credential into its protocol output - a channel that routinely
    flows into server logs, distributed traces, error trackers (e.g. Sentry),
    shared SSE streams, and client-side console output. Any party with access to
    those sinks then sees the secret. This is the black-box-observable half of the
    secret-leakage problem; verifying that secrets never reach external log/trace
    sinks additionally requires access to those sinks (see remediation).

    Reported CONFIRMED (the reflection is demonstrable) at medium severity. A
    server that authenticates, rejects, or errors WITHOUT echoing the presented
    credential produces no finding. The canary is unique per run, so a substring
    match cannot false-positive on unrelated content.

  references:
    - https://cwe.mitre.org/data/definitions/522.html
    - https://cwe.mitre.org/data/definitions/532.html
    - https://cwe.mitre.org/data/definitions/200.html

  tags:
    - mcp
    - secret-leakage
    - canary
    - credentials
    - cwe-522
    - cwe-532

attack:
  protocol: mcp
  type: mcp-secret-canary

remediation: |
  1. Never reflect the caller's credentials (bearer token, client secret, API key)
     into responses, error messages, or diagnostics - redact them at the boundary.
  2. Scrub secrets from logs, traces, and telemetry: filter Authorization headers
     and known secret fields before they reach any log/trace/error-reporting sink.
  3. Return generic authentication errors that do not echo the presented token.
  4. For full coverage, run a canary token end-to-end and confirm it never appears
     in plaintext in your log/trace/telemetry sinks (requires access to those
     sinks; this rule only observes the response channel).
