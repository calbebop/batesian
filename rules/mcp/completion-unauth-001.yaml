id: mcp-completion-unauth-001
info:
  name: MCP Completion Visibility Without Authentication
  author: batesian
  severity: medium
  description: |
    Tests whether an MCP server answers completion/complete requests without
    requiring authentication.

    completion/complete returns autocompletion suggestions for prompt arguments
    and resource-template URIs. Servers that support it advertise the
    "completions" capability in initialize or server/discover. Suggestions can be
    public or restricted by the deployment's policy.

    The rule reports two outcomes:
    - An anonymous completion result (info) shows the method answered.
      A non-authentication JSON-RPC error is only an indicator because it may
      come from validation before dispatch.
    - Real suggestion values for a discovered prompt argument or resource
      template are a medium indicator. Visibility is not itself a policy failure.

    completion/complete is read-only; the probe never executes a tool or mutates
    state and sends an empty prefix to request suggestions.

  references:
    - https://modelcontextprotocol.io/specification/2025-11-25/server/utilities/completion
    - https://modelcontextprotocol.io/docs/concepts/authorization
    - https://cwe.mitre.org/data/definitions/862.html
    - https://cwe.mitre.org/data/definitions/200.html

  tags:
    - mcp
    - auth
    - completion
    - information-disclosure
    - cwe-862
    - cwe-200

attack:
  protocol: mcp
  type: mcp-completion-unauth

remediation: |
  Review whether the returned suggestions are intended to be public. Require
  authorization for sensitive values, scope results to the caller, and rate-limit
  queries where enumeration is a concern.
