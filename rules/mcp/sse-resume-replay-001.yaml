id: mcp-sse-resume-replay-001
info:
  name: MCP SSE Resumption Cross-Session Replay (Last-Event-ID)
  author: batesian
  severity: high
  description: |
    Tests the MCP Streamable HTTP resumption mechanism (2025-03-26 / 2025-06-18),
    where a client reconnects an SSE stream by sending a Last-Event-ID header and
    the server MAY replay events emitted after that id. The spec requires that a
    server MUST NOT replay messages from a DIFFERENT stream/session. A server that
    replays another session's buffered events to a resuming client leaks one
    session's data into another (cross-session redelivery, CWE-488), and is also a
    replay vector (CWE-294).

    The check needs two distinct, server-minted sessions and only confirms a real
    cross-session leak:

      1. Initialize session A; open A's SSE stream (no Last-Event-ID) and capture
         an id-bearing checkpoint event plus the data of a later session-A event
         as a marker. If the server does not mint distinct session ids, or emits
         no id-bearing event with a later event to replay, the rule cannot test
         (no finding).
      2. Initialize session B; confirm B's session id differs from A's.
      3. As session B, resume with A's checkpoint id (Last-Event-ID set to A's
         exact event id; the spec treats event ids as opaque, so no arithmetic is
         applied). A CONFIRMED finding is raised only when B's resumed stream
         delivers A's data marker - i.e., the server replayed session A's event to
         session B. A server that replays only the requester's own events, or that
         ignores Last-Event-ID, produces no finding.

    Currency: GET-stream resumption via Last-Event-ID is normative in revisions
    2025-03-26 through 2025-11-25; the 2026-07-28 revision removes the GET stream
    and Last-Event-ID resumability, so this rule applies to servers on the earlier
    revisions (the deployed majority as of mid-2026).

  references:
    - https://modelcontextprotocol.io/specification/2025-11-25/basic/transports
    - https://modelcontextprotocol.io/specification/2025-06-18/basic/transports
    - https://cwe.mitre.org/data/definitions/488.html
    - https://cwe.mitre.org/data/definitions/294.html

  tags:
    - mcp
    - streamable-http
    - sse
    - resumption
    - replay
    - cwe-488

attack:
  protocol: mcp
  type: mcp-sse-resume-replay

remediation: |
  1. Scope event ids and any replay buffer to the originating session/stream;
     when resuming via Last-Event-ID, only replay events that belong to the same
     session as the reconnecting request.
  2. Bind the session to its credentials on resume - re-authorize the resuming
     request and reject a Last-Event-ID that does not belong to the caller's
     session.
  3. Use unguessable, per-stream event ids so a resume cannot reference another
     stream's events.
  4. Ensure replay does not re-trigger side effects (idempotent delivery) and that
     event ordering remains monotonic per stream.
