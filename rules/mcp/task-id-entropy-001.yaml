id: mcp-task-id-entropy-001
info:
  name: MCP Tasks Extension Handle Entropy
  author: batesian
  severity: high
  description: |
    Checks task IDs returned by the MCP 2026-07-28 Tasks extension. The rule
    advertises io.modelcontextprotocol/tasks on each approved tools/call and
    requires a matching resultType: task response. It flags numeric IDs minted
    with a constant stride and IDs with a low observed-alphabet estimate.

    Invoking a tool requires its exact name in --mcp-invoke-tool or
    mcp_invoke_tools and a readOnlyHint: true annotation. Annotations are
    untrusted hints; approval is still required. Missing approval, unavailable
    handles, and unsupported wires are not tested.

  references:
    - https://tasks.extensions.modelcontextprotocol.io/specification/2026-07-28/tasks
    - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
    - https://cwe.mitre.org/data/definitions/330.html

  tags:
    - mcp
    - tasks
    - entropy
    - bearer-token
    - cwe-330

attack:
  protocol: mcp
  type: mcp-task-id-entropy

remediation: |
  Generate task IDs with a cryptographically secure random source. Do not
  expose counters or timestamps as IDs. Authorize every task-related request,
  even when IDs are unguessable.
