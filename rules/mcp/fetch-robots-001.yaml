id: mcp-fetch-robots-001
info:
  name: MCP Fetch Robots Path Canonicalization
  author: batesian
  severity: low
  description: |
    Uses an operator-owned canary origin with an exact robots.txt disallow.
    The scanner verifies that the canonical and double-slash paths serve the
    same marker, then calls an explicitly approved, read-only fetch tool.
    A finding requires a robots denial for the canonical path and the marker
    returned through the alternate path. Other errors are not tested.

  references:
    - https://github.com/modelcontextprotocol/servers/security/advisories/GHSA-f9hh-cmx9-2f23
    - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
    - https://cwe.mitre.org/data/definitions/41.html

  tags:
    - mcp
    - fetch
    - robots
    - cwe-41

attack:
  protocol: mcp
  type: mcp-fetch-robots

remediation: |
  Check robots policy against both the request path and the origin-resolved
  path before fetching. Upgrade affected mcp-server-fetch deployments to
  2026.11.11 or later. Treat robots.txt as crawler policy, not access control.
