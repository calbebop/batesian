id: mcp-prompt-unauth-001
info:
  name: MCP Prompt Visibility Without Authentication
  author: batesian
  severity: medium
  description: |
    Reports prompt names returned by anonymous prompts/list and content returned
    by anonymous prompts/get. Public prompts are valid. Name visibility is an
    informational indicator; readable content is a medium indicator until the
    deployment's intended access policy is known.

  references:
    - https://modelcontextprotocol.io/docs/concepts/prompts
    - https://modelcontextprotocol.io/docs/concepts/authorization
    - https://cwe.mitre.org/data/definitions/862.html

  tags:
    - mcp
    - auth
    - prompt
    - information-disclosure
    - cwe-862

attack:
  protocol: mcp
  type: mcp-prompt-unauth

remediation: |
  Review which prompts are intended to be public. Require authorization for
  private prompts and avoid placing secrets in templates. Scope prompts/list
  and prompts/get consistently with that policy.
