version: 2

project_name: batesian

before:
  hooks:
    - go mod tidy

builds:
  - id: batesian
    main: ./cmd/batesian
    binary: batesian
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude windows/arm64 -- uncommon target, adds release size without benefit.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Generate a CycloneDX SBOM for each archive so users can audit dependencies.
# Requires syft to be available on the runner; the release workflow installs it.
sboms:
  - artifacts: archive

# Keyless cosign signing of the checksums file. Each tagged release is signed
# with a short-lived certificate from Sigstore's Fulcio CA, anchored by the
# GitHub Actions OIDC token. Verifiers can confirm the binary came from this
# repo's release pipeline. Requires cosign on the runner and id-token: write
# permission on the release job.
#
# cosign v3 removed --output-signature and --output-certificate from sign-blob
# and made --bundle required: the Sigstore bundle now carries the signature,
# the certificate and the transparency-log entry in one file, and replaces the
# separate .sig and .pem rather than accompanying them. GoReleaser publishes
# whatever `signature` names, so the bundle is named there.
#
# Releases up to v1.5.0 published checksums.txt.sig and checksums.txt.pem and
# remain verifiable exactly as before; from v1.6.0 the artifact is
# checksums.txt.sigstore.json instead.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    # Routine maintenance is filtered out of release notes. Two behaviours to
    # know when reading a generated changelog:
    #   - These excludes are applied BEFORE grouping, so a security fix
    #     committed as `chore:` is dropped outright and never reaches the
    #     Security group below.
    #   - The patterns are not scope-aware: `^chore:` matches `chore: x` but NOT
    #     `chore(ci): x`, so a scoped maintenance commit still lands under
    #     "Other" rather than being excluded.
    # Either way a security fix filed as a chore is mislabelled, so commit it as
    # `fix(deps):` or `fix(security):` (see CONTRIBUTING.md, Commit Style).
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch
  groups:
    # Security must precede the generic Bug fixes group: the first matching
    # group claims the commit, and `fix(deps):` also matches `fix(...)`.
    - title: Security
      regexp: '^.*?fix\((deps|security)\)!?:.+$'
      order: 0
    - title: New attack rules
      regexp: '^.*?rule(\(.+\))??!?:.+$'
      order: 1
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 2
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: calbebop
    name: batesian
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # The header is intentionally evergreen: it describes what Batesian is, not
  # what changed in a particular release. Per-release narrative used to live here
  # and went stale every time, because it had to be rewritten by hand before each
  # tag and nothing failed when it was not. The generated changelog below already
  # lists every change, grouped by Security, New attack rules, Features and Bug
  # fixes, with a link to each PR.
  #
  # The one value here that still needs a human is the rule count, since
  # goreleaser has no variable for it. Verify it against `ls rules/*/*.yaml | wc -l`
  # before tagging.
  header: |
    ## Batesian {{.Version}}

    Adversarial red-team CLI for AI agent protocols (A2A and MCP).
    39 bundled attack rules (18 A2A + 21 MCP). Single binary. No runtime dependencies.

    Every release is published with a cosign signature over `checksums.txt`, a
    CycloneDX SBOM per archive, and SLSA build provenance.

    ```bash
    # Build provenance
    gh attestation verify batesian_<version>_<platform>.tar.gz --repo calbebop/batesian

    # Checksums signature (Sigstore bundle)
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/calbebop/batesian/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    ### Install

    **Go:**
    ```bash
    go install github.com/calbebop/batesian/cmd/batesian@{{.Tag}}
    ```

    **Binary (Linux / macOS):**
    ```bash
    # Download the archive for your platform from the assets below, then:
    tar -xzf batesian_*.tar.gz
    chmod +x batesian
    sudo mv batesian /usr/local/bin/
    ```

    **Binary (Windows):**
    Download the `.zip` from assets below, extract, and place `batesian.exe` in a directory on your `PATH`.

  footer: |
    ---
    {{ if .PreviousTag -}}
    **Full changelog**: https://github.com/calbebop/batesian/compare/{{.PreviousTag}}...{{.Tag}}
    {{- else -}}
    **Full changelog**: https://github.com/calbebop/batesian/commits/{{.Tag}}
    {{- end }}
