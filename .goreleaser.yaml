version: 2

project_name: batesian

before:
  hooks:
    - go mod tidy

builds:
  - id: batesian
    main: ./cmd/batesian
    binary: batesian
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude windows/arm64 -- uncommon target, adds release size without benefit.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Generate a CycloneDX SBOM for each archive so users can audit dependencies.
# Requires syft to be available on the runner; the release workflow installs it.
sboms:
  - artifacts: archive

# Keyless cosign signing of the checksums file. Each tagged release is signed
# with a short-lived certificate from Sigstore's Fulcio CA, anchored by the
# GitHub Actions OIDC token. Verifiers can confirm the binary came from this
# repo's release pipeline. Requires cosign on the runner and id-token: write
# permission on the release job.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    # Routine maintenance is filtered out of release notes. Two behaviours to
    # know when reading a generated changelog:
    #   - These excludes are applied BEFORE grouping, so a security fix
    #     committed as `chore:` is dropped outright and never reaches the
    #     Security group below.
    #   - The patterns are not scope-aware: `^chore:` matches `chore: x` but NOT
    #     `chore(ci): x`, so a scoped maintenance commit still lands under
    #     "Other" rather than being excluded.
    # Either way a security fix filed as a chore is mislabelled, so commit it as
    # `fix(deps):` or `fix(security):` (see CONTRIBUTING.md, Commit Style).
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch
  groups:
    # Security must precede the generic Bug fixes group: the first matching
    # group claims the commit, and `fix(deps):` also matches `fix(...)`.
    - title: Security
      regexp: '^.*?fix\((deps|security)\)!?:.+$'
      order: 0
    - title: New attack rules
      regexp: '^.*?rule(\(.+\))??!?:.+$'
      order: 1
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 2
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: calbebop
    name: batesian
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # The rule count and any per-release sections in the header below are reviewed
  # before each tag. Keep them current; the auto-generated changelog lists the
  # commits.
  header: |
    ## Batesian {{.Version}}

    Adversarial red-team CLI for AI agent protocols (A2A and MCP).
    35 bundled attack rules (17 A2A + 18 MCP). Single binary. No runtime dependencies.

    ### Detection accuracy

    This release fixes several false negatives and false positives in the core
    detection logic, surfaced by validating against third-party reference servers
    rather than self-authored fixtures. The HTTP client no longer follows
    redirects: a 302 to a login page was being read as a successful call, and a
    redirect could carry the operator's bearer token to a third-party host. A 2xx
    response that is not valid JSON with a `result` envelope is no longer treated
    as a successful JSON-RPC call. MCP rules now report inconclusive instead of
    clean when no endpoint is reachable, offer current protocol versions so
    current servers no longer reject the handshake, send the `Mcp-Protocol-Version`
    header on follow-ups, rejoin multi-line SSE events so chunked responses are
    not dropped, and treat any non-auth JSON-RPC error (not only `-32602`) as proof
    an unauthenticated probe reached the handler.

    ### New rule

    `mcp-task-idor-001` covers the MCP 2025-11-25 tasks surface: cross-context
    reads of task state (`tasks/get`) and the underlying tool output
    (`tasks/result`), plus enumeration of another context's tasks via `tasks/list`.

    ### Install

    **Go:**
    ```bash
    go install github.com/calbebop/batesian/cmd/batesian@{{.Tag}}
    ```

    **Binary (Linux / macOS):**
    ```bash
    # Download the archive for your platform from the assets below, then:
    tar -xzf batesian_*.tar.gz
    chmod +x batesian
    sudo mv batesian /usr/local/bin/
    ```

    **Binary (Windows):**
    Download the `.zip` from assets below, extract, and place `batesian.exe` in a directory on your `PATH`.

  footer: |
    ---
    {{ if .PreviousTag -}}
    **Full changelog**: https://github.com/calbebop/batesian/compare/{{.PreviousTag}}...{{.Tag}}
    {{- else -}}
    **Full changelog**: https://github.com/calbebop/batesian/commits/{{.Tag}}
    {{- end }}
