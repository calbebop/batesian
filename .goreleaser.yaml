version: 2

project_name: batesian

before:
  hooks:
    - go mod tidy

builds:
  - id: batesian
    main: ./cmd/batesian
    binary: batesian
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude windows/arm64 -- uncommon target, adds release size without benefit.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Generate a CycloneDX SBOM for each archive so users can audit dependencies.
# Requires syft to be available on the runner; the release workflow installs it.
sboms:
  - artifacts: archive

# Sign checksums keylessly with GitHub OIDC. Cosign v3 stores the signature,
# certificate, and transparency-log entry in one Sigstore bundle.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    # Filters run before groups. Unscoped chore: commits are excluded; scoped
    # chore(...): commits fall through to Other. Use fix(deps): or fix(security):
    # for security fixes.
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch
  groups:
    # Security must precede the generic Bug fixes group: the first matching
    # group claims the commit, and `fix(deps):` also matches `fix(...)`.
    - title: Security
      regexp: '^.*?fix\((deps|security)\)!?:.+$'
      order: 0
    - title: New attack rules
      regexp: '^.*?rule(\(.+\))??!?:.+$'
      order: 1
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 2
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: calbebop
    name: batesian
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  # Keep the header release-agnostic; the changelog covers release-specific
  # changes. Update the bundled rule count before tagging.
  header: |
    ## Batesian {{.Version}}

    Adversarial red-team CLI for AI agent protocols (A2A and MCP).
    47 bundled attack rules (19 A2A + 28 MCP). Single binary. No runtime dependencies.

    This release is published with a cosign signature over `checksums.txt`, a
    CycloneDX SBOM per archive, and SLSA build provenance.

    ```bash
    # Build provenance
    gh attestation verify batesian_<version>_<platform>.tar.gz --repo calbebop/batesian

    # Checksums signature (Sigstore bundle)
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/calbebop/batesian/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    ### Install

    **Go:**
    ```bash
    go install github.com/calbebop/batesian/cmd/batesian@{{.Tag}}
    ```

    **Binary (Linux / macOS):**
    ```bash
    # Download the archive for your platform from the assets below, then:
    tar -xzf batesian_*.tar.gz
    chmod +x batesian
    sudo mv batesian /usr/local/bin/
    ```

    **Binary (Windows):**
    Download the `.zip` from assets below, extract, and place `batesian.exe` in a directory on your `PATH`.

  footer: |
    ---
    {{ if .PreviousTag -}}
    **Full changelog**: https://github.com/calbebop/batesian/compare/{{.PreviousTag}}...{{.Tag}}
    {{- else -}}
    **Full changelog**: https://github.com/calbebop/batesian/commits/{{.Tag}}
    {{- end }}
