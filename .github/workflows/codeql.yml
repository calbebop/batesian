name: CodeQL

# Static analysis for the Go source. golangci-lint covers style and correctness
# linting; CodeQL adds dataflow-based security analysis (injection, path
# traversal, unsafe deserialization, credential handling) and reports into the
# Security tab. Both run on every push and pull request.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, Monday 06:15 UTC. Catches newly published CodeQL queries against
    # code that has not otherwise changed.
    - cron: '15 6 * * 1'
  # Manual fallback when event delivery is unavailable.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed by the action to read workflow run metadata.
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the toolchain to the version go.mod requires so autobuild does not
      # fall back to whatever Go ships on the runner image.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:go"
