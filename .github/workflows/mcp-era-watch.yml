name: MCP era watch

# Validates MCP behavior against current Python and TypeScript SDKs.

on:
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, Tuesday 07:23 UTC. An odd minute keeps this off the top-of-hour
    # spike that every scheduled workflow lands on.
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect the era of a real modern server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the MCP Python SDK
        # Intentionally track the current SDK to detect upstream protocol drift.
        run: pip install "mcp>=2,<3" uvicorn

      - name: Start the modern-era server
        run: |
          nohup python testdata/mcp_modern_era_server.py > /tmp/mcp-modern-server.log 2>&1 &
          # Probe server/discover readiness, not just an open port.
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:7799/mcp \
              -X POST -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H 'Mcp-Method: server/discover' \
              -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}'; then
              echo "server is answering server/discover"
              exit 0
            fi
            sleep 2
          done
          echo "modern-era server did not answer within the timeout"
          cat /tmp/mcp-modern-server.log
          exit 1

      - name: Check era detection against it
        run: go test -tags=integration -run 'TestDetectEra_Live|TestInitializeMCP_Live|TestOpenSessions_Live' -v ./internal/attack/mcp/
        env:
          BATESIAN_LIVE_MCP_ENDPOINT: http://127.0.0.1:7799/mcp

      - name: Check cache scope against the current SDK
        run: |
          cat > "$RUNNER_TEMP/cache-scope.yaml" <<'YAML'
          principals:
            - name: tenant-a
              token: "${CACHE_A}"
            - name: tenant-b
              token: "${CACHE_B}"
          YAML
          go run ./cmd/batesian scan --config "$RUNNER_TEMP/cache-scope.yaml" \
            --target http://127.0.0.1:7799/mcp --protocol mcp \
            --rule-ids mcp-cache-scope-001 --output json > "$RUNNER_TEMP/cache-scope.json"
          jq -e '
            .schema_version == 1 and .ruleset.selected == 1 and
            (.rule_outcomes | length) == 1 and
            .rule_outcomes[0].status == "no_findings" and
            (.findings | length) == 0
          ' "$RUNNER_TEMP/cache-scope.json"
        env:
          CACHE_A: cache-test-a
          CACHE_B: cache-test-b

      - name: Server log
        if: failure()
        run: cat /tmp/mcp-modern-server.log

  typescript:
    name: Check the current TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install the MCP TypeScript SDK
        # Track the current v2 server without running dependency scripts.
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
        working-directory: testdata/mcp_ts_sdk

      - name: Check SDK compatibility and conformance subset
        run: |
          node testdata/mcp_ts_sdk/server.mjs > "$RUNNER_TEMP/mcp-ts-sdk.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7798/mcp \
              -X POST -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H 'Mcp-Method: server/discover' \
              -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
              | jq -e '.result.supportedVersions | index("2026-07-28")' > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/mcp-ts-sdk.log"
            exit 1
          fi

          go test -tags=integration \
            -run 'TestDetectEra_Live|TestInitializeMCP_Live|TestOpenSessions_Live|TestNamedTool_LiveTypeScriptSDK|TestSkillsIntegrity_LiveTypeScriptSDK' \
            -v ./internal/attack/mcp/

          pushd "$RUNNER_TEMP"
          npx --yes @modelcontextprotocol/conformance@0.1.16 server \
            --url http://127.0.0.1:7798/mcp --scenario server-initialize
          npx --yes @modelcontextprotocol/conformance@0.1.16 server \
            --url http://127.0.0.1:7798/mcp --scenario tools-list
          popd
        env:
          BATESIAN_LIVE_MCP_ENDPOINT: http://127.0.0.1:7798/mcp
          BATESIAN_LIVE_MCP_SDK: typescript

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/mcp-ts-sdk.log"
