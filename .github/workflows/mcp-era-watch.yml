name: MCP era watch

# Batesian's MCP rules target the handshake-based protocol revisions. Era
# detection (internal/attack/mcp/era.go) exists so a server speaking the
# stateless 2026-07-28 revision is reported as unsupported rather than as
# unreachable, which is the difference between "this scanner does not speak your
# protocol version" and a bare "could not connect".
#
# That detection was written from the specification, at a time when nothing
# implemented the revision. It does now: the Tier-1 SDKs shipped 2026-07-28
# support on 2026-07-27 and 2026-07-28 (TypeScript @modelcontextprotocol/server
# 2.0.0, Python mcp 2.0.0, Go 1.7.0, C# 2.0). So this job stopped being a watch
# for something to appear and became a check that detection still works against
# what did.
#
# It boots testdata/mcp_modern_era_server.py, built on the official Python SDK,
# and runs the real detectEra against it rather than a reimplementation. A
# failure means the specification, the SDK, or our detection has moved, and a
# scheduled failure notifies on its own; there is no issue-filing step and this
# job needs no write permission.

on:
  schedule:
    # Weekly, Tuesday 07:23 UTC. An odd minute keeps this off the top-of-hour
    # spike that every scheduled workflow lands on.
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect the era of a real modern server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the MCP Python SDK
        # Unpinned on purpose. The point of this job is to notice when the
        # current SDK stops matching our detection, so it has to track the
        # version an operator would actually install.
        run: pip install "mcp>=2" uvicorn

      - name: Start the modern-era server
        run: |
          nohup python testdata/mcp_modern_era_server.py > /tmp/mcp-modern-server.log 2>&1 &
          # Readiness is a real server/discover, not a port check: the point is
          # that the endpoint answers the request detection sends, so a server
          # that is listening but not yet serving does not race the test.
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:7799/mcp \
              -X POST -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H 'Mcp-Method: server/discover' \
              -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}'; then
              echo "server is answering server/discover"
              exit 0
            fi
            sleep 2
          done
          echo "modern-era server did not answer within the timeout"
          cat /tmp/mcp-modern-server.log
          exit 1

      - name: Check era detection against it
        run: go test -tags=integration -run 'TestDetectEra_Live|TestInitializeMCP_Live|TestOpenSessions_Live' -v ./internal/attack/mcp/
        env:
          BATESIAN_LIVE_MCP_ENDPOINT: http://127.0.0.1:7799/mcp

      - name: Server log
        if: failure()
        run: cat /tmp/mcp-modern-server.log
