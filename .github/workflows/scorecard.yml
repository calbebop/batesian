name: Scorecard

# Publishes OpenSSF Scorecard results for the README badge and Security tab.
# Classic branch-protection scoring may have reduced confidence without a
# fine-grained PAT.

on:
  push:
    # Only the default branch is supported.
    branches:
      - main
  schedule:
    # Weekly, Monday 05:30 UTC.
    - cron: '30 5 * * 1'
  # Manual fallback when event delivery is unavailable.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed for the GitHub OIDC token when publish_results is true.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the README badge to resolve, and it lets the Scorecard
          # project reuse this run instead of scanning the repo separately.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
