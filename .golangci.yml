version: "2"

run:
  timeout: 5m
  tests: true
  # Without this the integration-tagged files are invisible to every linter,
  # so era_live_test.go would ship unlinted. Analysing them costs nothing here:
  # the tag only gates whether `go test` runs them, and they need a live server
  # to run, not to compile.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    revive:
      rules:
        # Do not require doc comments on exported declarations or packages.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
        - name: unused-parameter
          disabled: true

    gosec:
      # G104 is superseded by errcheck. G304/G102/G704 are intentional in a security scanner.
      excludes:
        - G104
        - G304
        - G102
        - G704
      severity: medium
      confidence: medium

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: cmd/batesian/main\.go
        linters:
          - revive
      # Close errors during response, connection, and listener cleanup are non-actionable.
      - text: "Error return value of `.*\\.Close` is not checked"
        linters:
          - errcheck
      # CLI output write failures are non-actionable.
      - text: "Error return value of `fmt\\.F(printf|println|print)` is not checked"
        linters:
          - errcheck
      # CLI table-flush failures are non-actionable.
      - text: "Error return value of `.*\\.Flush` is not checked"
        linters:
          - errcheck
      # Listener shutdown errors are non-actionable.
      - text: "Error return value of `.*\\.Serve` is not checked"
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
